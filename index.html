<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="InventarioMed - Gestión de inventario, stock y alertas para farmacia y clínica. Escanea códigos de barras desde tu teléfono." />
  <meta name="theme-color" content="#78AED7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>InventarioMed - Gestión de Farmacia</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header-brand">
      <div class="app-header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
          <path d="M8.5 8.5 15.5 15.5"/>
        </svg>
      </div>
      <div>
        <div class="app-header-title">InventarioMed</div>
        <div class="app-header-subtitle">Gestión de Farmacia</div>
      </div>
    </div>
  </header>

  <!-- TABS -->
  <nav class="tabs-bar" role="tablist">
    <button class="tab-btn active" data-tab="alerts" role="tab" aria-selected="true" id="tab-alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
      </svg>
      Alertas
    </button>
    <button class="tab-btn" data-tab="inventory" role="tab" aria-selected="false" id="tab-inventory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>
        <path d="M12 22V12"/><path d="M7.5 4.27 16.5 9.42"/>
      </svg>
      Inventario
    </button>
  </nav>

  <!-- TAB: ALERTAS Y MOVIMIENTOS -->
  <section id="panel-alerts" class="tab-panel active" role="tabpanel" aria-labelledby="tab-alerts">

    <!-- Alertas -->
    <div class="card">
      <div class="flex-between">
        <div class="card-header" style="margin-bottom:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
            <path d="M12 9v4"/><path d="M12 17h.01"/>
          </svg>
          <h2>Alertas</h2>
        </div>
        <button class="btn-secondary btn-refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Actualizar
        </button>
      </div>

      <div class="alert-banner mt-16">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
          <path d="M12 9v4"/><path d="M12 17h.01"/>
        </svg>
        <p>Lotes con stock bajo o caducidad próxima. Tócalos para actuar.</p>
      </div>

      <div id="alerts-list"></div>
    </div>
  </section>

  <!-- TAB: INVENTARIO COMPLETO -->
  <section id="panel-inventory" class="tab-panel" role="tabpanel" aria-labelledby="tab-inventory">
    <div class="search-bar">
      <input class="form-input" id="inventory-search" type="text" placeholder="Buscar medicamento, lote o categoría..." />
      <div class="badge" id="inventory-count">0 lotes</div>
    </div>
    <div id="inventory-content"></div>
    <div class="text-right mt-16">
      <button class="btn-secondary btn-refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        Refrescar
      </button>
    </div>
  </section>

  <!-- MODAL: Registrar Movimiento -->
  <div id="movement-modal" class="modal-overlay"></div>

  <!-- FAB: ESCANEAR -->
  <button class="fab-scan" id="fab-scan" aria-label="Escanear código de barras">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
      <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
      <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
      <line x1="7" y1="8" x2="17" y2="8"/>
      <line x1="7" y1="16" x2="17" y2="16"/>
    </svg>
  </button>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/scanner.js"></script>
  <script src="./js/inventory.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
